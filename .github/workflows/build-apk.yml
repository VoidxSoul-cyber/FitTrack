
name: Build FitTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FitTrackAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o FitTrackAndroid_Project.zip -d extracted
          test -f extracted/FitTrackAndroid/app/build.gradle

      - name: Build APK
        working-directory: extracted/FitTrackAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-debug-apk
          path: extracted/FitTrackAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
